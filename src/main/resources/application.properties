spring.application.name=amalbek-miras-student-api
server.port=8080
server.servlet.context-path=/amalbek-miras

app.author=Amalbek Miras
app.version=${APP_VERSION:1.0}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/students_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
